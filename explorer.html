<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Cap Explorer - 100 Largest Companies</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/explorer.css" rel="stylesheet">
</head>
<body>
  <div class="container-fluid">
    <!-- Header -->
    <header class="d-flex justify-content-between align-items-center py-3 border-bottom">
      <div>
        <h1 class="h3 mb-0">Market Cap Explorer</h1>
        <p class="text-muted mb-0 small">100 Largest Companies by Market Capitalization</p>
      </div>
      <div class="d-flex align-items-center gap-3">
        <div class="year-selector btn-group" role="group" aria-label="Year selector">
          <button type="button" class="btn btn-outline-primary" data-year="2004">2004</button>
          <button type="button" class="btn btn-outline-primary active" data-year="2024">2024</button>
          <button type="button" class="btn btn-outline-primary" data-year="2025">2025</button>
        </div>
        <div class="compare-selector">
          <select id="compare-select" class="form-select form-select-sm">
            <option value="">Compare with...</option>
            <option value="2004">vs 2004</option>
            <option value="2024">vs 2024</option>
            <option value="2025">vs 2025</option>
          </select>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <div class="row mt-3">
      <!-- Sidebar Filters -->
      <aside class="col-lg-2 col-md-3" id="filters-panel">
        <div class="card">
          <div class="card-body">
            <!-- Search -->
            <div class="mb-3">
              <label for="search-input" class="form-label fw-bold">
                <i class="bi bi-search"></i> Search
              </label>
              <input type="text" class="form-control form-control-sm" id="search-input"
                     placeholder="Company or symbol...">
            </div>

            <!-- Sector Filter -->
            <div class="mb-3">
              <label class="form-label fw-bold">
                <i class="bi bi-pie-chart"></i> Sectors
              </label>
              <div id="sector-filters" class="filter-checkboxes">
                <!-- Populated by JS -->
              </div>
            </div>

            <!-- Region Filter -->
            <div class="mb-3">
              <label class="form-label fw-bold">
                <i class="bi bi-globe"></i> Regions
              </label>
              <div id="region-filters" class="filter-checkboxes">
                <!-- Populated by JS -->
              </div>
            </div>

            <!-- Reset Filters -->
            <button id="reset-filters" class="btn btn-outline-secondary btn-sm w-100">
              <i class="bi bi-x-circle"></i> Reset Filters
            </button>
          </div>
        </div>
      </aside>

      <!-- Chart Area -->
      <main class="col-lg-10 col-md-9">
        <!-- View Toggle -->
        <div class="d-flex justify-content-between align-items-center mb-2">
          <div class="view-toggle btn-group btn-group-sm" role="group">
            <button type="button" class="btn btn-outline-secondary active" data-view="chart">
              <i class="bi bi-circle"></i> Chart
            </button>
            <button type="button" class="btn btn-outline-secondary" data-view="table">
              <i class="bi bi-table"></i> Table
            </button>
          </div>
          <div class="stats-summary">
            <span id="filtered-count" class="badge bg-secondary">100 companies</span>
          </div>
        </div>

        <!-- Chart Container -->
        <div id="chart-container" class="chart-wrapper">
          <div id="chart-single" class="chart-area"></div>
          <div id="chart-compare" class="chart-area d-none">
            <div class="row">
              <div class="col-6">
                <div class="chart-label" id="chart-left-label">2024</div>
                <div id="chart-left"></div>
              </div>
              <div class="col-6">
                <div class="chart-label" id="chart-right-label">2025</div>
                <div id="chart-right"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Table Container -->
        <div id="table-container" class="d-none">
          <div class="table-responsive">
            <table class="table table-hover table-sm" id="companies-table">
              <thead class="table-light sticky-top">
                <tr>
                  <th data-sort="rank">Rank <i class="bi bi-arrow-down-up"></i></th>
                  <th data-sort="name">Company <i class="bi bi-arrow-down-up"></i></th>
                  <th data-sort="symbol">Symbol <i class="bi bi-arrow-down-up"></i></th>
                  <th data-sort="sector">Sector <i class="bi bi-arrow-down-up"></i></th>
                  <th data-sort="country">Country <i class="bi bi-arrow-down-up"></i></th>
                  <th data-sort="marketcap" class="text-end">Market Cap <i class="bi bi-arrow-down-up"></i></th>
                </tr>
              </thead>
              <tbody id="table-body">
                <!-- Populated by JS -->
              </tbody>
            </table>
          </div>
          <button id="export-csv" class="btn btn-outline-primary btn-sm mt-2">
            <i class="bi bi-download"></i> Export CSV
          </button>
        </div>

        <!-- Legend -->
        <div id="legend" class="mt-3">
          <!-- Populated by JS -->
        </div>
      </main>
    </div>

    <!-- Company Detail Panel (Offcanvas) -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="company-detail" aria-labelledby="company-detail-title">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="company-detail-title">Company Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body">
        <div id="company-detail-content">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>

    <!-- Tooltip -->
    <div id="tooltip" class="tooltip-custom">
      <!-- Populated by JS -->
    </div>
  </div>

  <!-- Footer -->
  <footer class="container-fluid py-3 mt-4 border-top">
    <p class="text-center text-muted small mb-0">
      Data source: <a href="https://companiesmarketcap.com/" target="_blank">companiesmarketcap.com</a>
    </p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
